name: Feature Request
description: 提出新功能建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请详细描述你想要的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 你遇到了什么问题？这个功能要解决什么？
      placeholder: 例如：每次都要手动检查更新很麻烦...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望如何解决这个问题？
      placeholder: 例如：希望能在 LuCI 界面看到实时的播放状态
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过其他解决方案吗？
      placeholder: 例如：或者可以通过命令行查看...

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 在什么场景下会用到这个功能？
      placeholder: 例如：我想在手机离开后，从路由器的 Web 界面控制播放

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 其他可能有帮助的信息
      placeholder: 例如：参考实现、截图、示例代码等

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已经搜索过现有的 Issues
          required: true
        - label: 这个功能符合项目的目标和范围
          required: true
