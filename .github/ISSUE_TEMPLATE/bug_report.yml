name: Bug Report
description: 报告一个 Bug
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告 Bug！请填写以下信息帮助我们定位问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰地描述遇到的问题
      placeholder: 例如：服务启动后立即退出
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 提供系统环境信息
      value: |
        - OpenWrt 版本:
        - 设备型号:
        - CPU 架构:
        - spotify-soloist 版本:
        - luci-app-spotify-soloist 版本:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 重现步骤
      description: 如何重现这个问题？
      placeholder: |
        1. 执行命令 '...'
        2. 点击按钮 '...'
        3. 查看错误 '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
      placeholder: 服务应该正常运行
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: 服务启动失败并退出
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 提供相关日志信息 (logread | grep soloist)
      render: shell
      placeholder: |
        粘贴日志输出...

  - type: textarea
    id: config
    attributes:
      label: 配置信息
      description: 提供相关配置 (uci show spotify-soloist)
      render: shell
      placeholder: |
        粘贴配置输出...

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 其他可能有帮助的信息
      placeholder: 例如：截图、额外的上下文等

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已经搜索过现有的 Issues
          required: true
        - label: 我已经阅读过文档
          required: true
        - label: 我使用的是最新版本
          required: false
